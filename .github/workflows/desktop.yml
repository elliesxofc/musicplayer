# Builds the moonlit desktop app for Windows (Rust + Tauri, Windows' own WebView2).
# Run it from the Actions tab ("Run workflow"), or push a tag like desktop-v2.0.0
# to also publish the installer as a GitHub Release.
name: desktop app

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        working-directory: tauri
        run: cargo test --release
      - name: Build the installer
        working-directory: tauri
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis
      - name: Name it
        shell: bash
        run: |
          v=$(node -p "require('./tauri/tauri.conf.json').version")
          mkdir -p out
          cp tauri/target/release/bundle/nsis/*-setup.exe "out/moonlit-setup-$v.exe"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: moonlit-windows
          path: out/*.exe
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" out/*.exe \
            --title "moonlit desktop ${{ github.ref_name }}" \
            --notes "moonlit-setup installs moonlit like a normal program."

  # the previous (Electron) desktop app, kept buildable while the Rust one settles in
  electron:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: moonlit-windows-electron
          path: dist/*.exe
          if-no-files-found: error
