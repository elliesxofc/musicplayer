<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>moonlit · now playing</title>
<!--
  moonlit "now playing" overlay. In OBS: Sources → + → Browser → URL http://localhost:4848/overlay
  options (add to the URL, e.g. /overlay?layout=line&hidepaused=1):
    layout=card | line     card with cover art (default), or a single line of text
    layout=bars            only the visualizer (like Spectralizer): see-through, sized from moonlit's
                           settings (bars × (bar width + spacing), bar height)
    hidepaused=1           fade out while the music is paused
    nocover=1              card without the cover art
    noprogress=1           no progress bar or time
    accent=ff7eb6          main colour (hex, without #)
  the music bars are switched on and off in moonlit itself (obs · now playing), and styled under
  "visualizer" in moonlit's settings (mode, filter, detail, gravity, colours, …): no address change needed
-->
<style>
  :root {
    --accent: #ff7eb6; --accent2: #c49bff; --ink: #fff3f8; --muted: #e6bfd4;
    /* card colours; replaced by moonlit's theme when "match moonlit's theme" is on */
    --card1: rgba(40, 12, 34, .86); --card2: rgba(26, 10, 24, .86); --pill: rgba(30, 10, 26, .8);
    --edge: rgba(255, 150, 200, .28); --divider: rgba(255, 150, 200, .22); --track: rgba(255, 255, 255, .14);
  }
  :root, .card, .line, .upnext { transition: background .6s ease, border-color .6s ease, color .6s ease; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font-family: "DM Sans", "Segoe UI", system-ui, sans-serif; color: var(--ink); padding: 12px; }
  .np { transition: opacity .5s ease, transform .5s ease; }
  .np.hidden { opacity: 0; transform: translateY(8px); }

  /* card */
  .card {
    display: flex; align-items: center; gap: 16px; width: max-content; max-width: calc(100vw - 24px);
    padding: 14px 18px 14px 14px; border-radius: 22px;
    background: linear-gradient(135deg, var(--card1), var(--card2));
    border: 1px solid var(--edge);
    box-shadow: 0 12px 40px -12px rgba(0, 0, 0, .6), inset 0 1px 0 rgba(255, 255, 255, .06);
  }
  .cover {
    width: 76px; height: 76px; border-radius: 16px; flex: none; object-fit: cover;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 6px 18px -6px var(--accent);
  }
  .text { min-width: 0; width: 360px; }
  .label { font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); display: flex; align-items: center; gap: 7px; }
  .label i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .paused .label i { background: var(--muted); box-shadow: none; }
  .title { margin-top: 4px; font-size: 22px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .artist { font-size: 15px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .progress { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--muted); }
  .bar { flex: 1; height: 5px; border-radius: 5px; background: var(--track); overflow: hidden; }
  .bar b { display: block; height: 100%; width: 0; border-radius: 5px; background: linear-gradient(90deg, var(--accent), var(--accent2)); box-shadow: 0 0 10px var(--accent); }

  /* line */
  .line {
    display: inline-flex; align-items: center; gap: 12px; padding: 8px 16px; border-radius: 999px;
    background: var(--pill); border: 1px solid var(--edge);
    font-size: 20px; font-weight: 600; white-space: nowrap; max-width: calc(100vw - 24px);
  }
  .line .song { overflow: hidden; text-overflow: ellipsis; }
  .line .time { font-size: 16px; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }

  /* music bars: switched on and off from moonlit (obs · now playing) */
  .spec { display: block; width: 100%; height: var(--spec-h, 30px); margin-top: 10px; transition: height .4s ease, margin .4s ease, opacity .4s ease; }
  .spec.off { height: 0; margin-top: 0; opacity: 0; }
  .line .spec { width: 84px; height: 26px; margin: 0; flex: none; }
  .line .spec.off { width: 0; height: 26px; margin-right: -12px; }

  /* up next: opens up inside the card (or the line) in the last seconds of a song */
  .upnext {
    display: grid; grid-template-rows: 0fr; opacity: 0;
    transition: grid-template-rows .55s cubic-bezier(.2, .8, .2, 1), opacity .4s ease, margin .55s ease;
  }
  .upnext > div { overflow: hidden; min-height: 0; }
  .upnext.show { grid-template-rows: 1fr; opacity: 1; margin-top: 10px; }
  .un-row {
    display: flex; align-items: center; gap: 10px; padding-top: 10px; white-space: nowrap;
    border-top: 1px solid var(--divider);
  }
  .upnext img { width: 34px; height: 34px; border-radius: 9px; object-fit: cover; flex: none; background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .upnext .un-text { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .upnext .un-label { font-size: 10.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
  .upnext .un-label em { font-style: normal; color: var(--muted); letter-spacing: .06em; text-transform: none; margin-left: 4px; }
  .upnext .un-song { font-size: 14.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .upnext .un-time { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; margin-left: auto; padding-left: 6px; }
  /* one line: the pill grows sideways to make room */
  .line .upnext { display: flex; grid-template-rows: none; max-width: 0; transition: max-width .6s cubic-bezier(.2, .8, .2, 1), opacity .4s ease; margin: 0 0 0 -12px; }
  .line .upnext.show { max-width: 520px; margin: 0; }
  .line .un-row { border-top: 0; border-left: 1px solid var(--divider); padding: 0 0 0 12px; }
  .line .upnext img { width: 24px; height: 24px; border-radius: 50%; }
  .line .upnext .un-text { flex-direction: row; align-items: baseline; gap: 8px; }
  .line .upnext .un-song { font-size: 17px; }

  /* no card (moonlit: "show the card behind the song and the bars" off): only the text, cover and
     bars, with a soft shadow so the words stay readable on any background */
  body.plain .card, body.plain .line { background: none; border-color: transparent; box-shadow: none; }
  body.plain .card, body.plain .line { text-shadow: 0 1px 2px rgba(0, 0, 0, .7), 0 0 12px rgba(0, 0, 0, .35); }
  body.plain .card { padding-left: 0; }
  body.plain .line { padding-left: 0; }
  body.plain .spec { filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .5)); }

  /* only the visualizer (layout=bars): no card, no padding, the page is the bars */
  body.solo { padding: 0; }
  .spec.solo { margin: 0; transition: opacity .4s ease; }
  .spec.solo.off { opacity: 0; }

  .swap { animation: swap .6s ease; }
  @keyframes swap { from { opacity: 0; transform: translateX(-10px); } }
</style>
</head>
<body>
<div class="np hidden" id="np"></div>
<script src="/vizcore.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('accent')) document.documentElement.style.setProperty('--accent', '#' + q.get('accent').replace(/[^0-9a-f]/gi, ''));
  const layout = ['line', 'bars'].includes(q.get('layout')) ? q.get('layout') : 'card';
  const solo = layout === 'bars';
  document.body.classList.toggle('solo', solo);
  const np = document.getElementById('np');
  np.innerHTML = solo ? '<canvas class="spec solo off"></canvas>' : layout === 'card'
    ? `<div class="card"><img class="cover" alt="">
         <div class="text"><div class="label"><i></i><span class="state">now playing</span></div>
         <div class="title"></div><div class="artist"></div>
         <div class="progress"><span class="cur">0:00</span><div class="bar"><b></b></div><span class="dur">0:00</span></div>
         <canvas class="spec off"></canvas></div></div>`
    : `<div class="line"><canvas class="spec off"></canvas><span class="song"></span><span class="time"></span></div>`;
  // "up next" lives inside the card (under the bars) or at the end of the line
  if (!solo) (layout === 'card' ? np.querySelector('.text') : np.querySelector('.line')).insertAdjacentHTML('beforeend',
    `<div class="upnext"><div><div class="un-row"><img alt=""><div class="un-text">
    <span class="un-label">up next<em></em></span><span class="un-song"></span></div><span class="un-time"></span></div></div></div>`);
  const $ = s => np.querySelector(s);
  const up = np.querySelector('.upnext');
  const NO_COVER = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
  if (q.get('nocover')) { $('.cover')?.remove(); up?.querySelector('img').remove(); }
  if (q.get('noprogress')) { $('.progress')?.remove(); $('.time')?.remove(); }

  const fmt = s => { s = Math.max(0, Math.floor(s || 0)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, '0'); return h ? `${h}:${String(m).padStart(2, '0')}:${x}` : `${m}:${x}`; };
  let s = null, got = 0;

  // moonlit's theme colours (when "match moonlit's theme" is on), or the overlay's own pink
  const THEME_VARS = ['accent', 'accent2', 'ink', 'muted', 'card1', 'card2', 'pill', 'edge', 'divider', 'track'];
  let themeKey = '';
  function applyTheme(t) {
    const key = t ? JSON.stringify(t) : '';
    if (key === themeKey) return;
    themeKey = key;
    const root = document.documentElement.style;
    for (const v of THEME_VARS) {
      if (t && t[v]) root.setProperty(`--${v}`, t[v]);
      else if (!(v === 'accent' && q.get('accent'))) root.removeProperty(`--${v}`);
    }
    if (!t && q.get('accent')) root.setProperty('--accent', '#' + q.get('accent').replace(/[^0-9a-f]/gi, ''));
  }

  // this page's version; after a moonlit update OBS still shows the old page, so reload it
  const BUILD = '__BUILD__';
  function apply(next) {
    if (next.build && BUILD !== '_' + '_BUILD__' && next.build !== BUILD) { location.reload(); return; }
    applyTheme(next.theme);
    document.body.classList.toggle('plain', !!next.plain);
    const changed = !s || s.id !== next.id;
    s = next; got = performance.now();
    if (!s.id) { np.classList.add('hidden'); return; }
    if (changed) {
      if (layout === 'card') {
        $('.title').textContent = s.title;
        $('.artist').textContent = [s.artist, s.album].filter(Boolean).join(' · ');
        loadCover(true);
      }
      const box = np.firstElementChild; if (!solo) { box.classList.remove('swap'); void box.offsetWidth; box.classList.add('swap'); }
    }
    // the one-line text follows format changes straight away, not only on the next song
    if (layout === 'line') $('.song').textContent = s.line || [s.artist, s.title].filter(Boolean).join(' - ');
    np.classList.toggle('paused', !s.playing);
    if (layout === 'card') $('.state').textContent = s.playing ? 'now playing' : 'paused';
    np.classList.toggle('hidden', !!q.get('hidepaused') && !s.playing);
    if (changed && up) { up.classList.remove('show'); upFor = ''; }
    // no bars for Spotify: its sound plays in the Spotify app, so moonlit can't hear it
    // (the visualizer source ignores the card's bars switch: adding it in OBS is the switch)
    spec.classList.toggle('off', (!solo && !s.spectrum) || s.source === 'spotify');
    tick();
  }

  /* music bars: levels arrive about 30 times a second while music plays; drawing eases
     between them at the screen's frame rate, and the bars settle down when it stops.
     How they look and move comes from moonlit's visualizer settings, through the same
     engine the app uses (vizcore.js). */
  const spec = $('.spec'), sg = spec.getContext('2d');
  const shape = VizCore.shaper();
  let target = [], lastLevels = 0, lastT = 0, shift = 0;
  let lastViz, look = VizCore.options(null), goals = new Float32Array(0), colors = null;
  function drawSpectrum(now) {
    requestAnimationFrame(drawSpectrum);
    const dt = Math.min(100, now - (lastT || now));
    lastT = now;
    if (spec.classList.contains('off') && !solo) return;
    // (settings and colours are only worked out again when they change, not every frame)
    const viz = s && s.viz;
    if (viz !== lastViz) { lastViz = viz; look = VizCore.options(viz); }
    const o = look;
    const dpr = window.devicePixelRatio || 1;
    if (solo) {
      // the source's size: every bar plus the gaps between them, and the bar height
      const cw = `${o.bars * (o.barWidth + o.barSpacing) - o.barSpacing}px`, ch = `${o.barHeight}px`;
      if (spec.style.width !== cw) spec.style.width = cw;
      if (spec.style.height !== ch) spec.style.height = ch;
    } else {
      // size: taller bars on the card; the one-line style keeps its height and just reaches higher
      const cssH = layout === 'card' ? `${Math.round(30 * Math.min(2, Math.max(0.4, o.size)))}px` : '';
      if (spec.style.getPropertyValue('--spec-h') !== cssH) spec.style.setProperty('--spec-h', cssH);
    }
    const w = Math.round(spec.clientWidth * dpr), h = Math.round(spec.clientHeight * dpr);
    if (!w || !h) return;
    if (spec.width !== w || spec.height !== h) { spec.width = w; spec.height = h; }
    const fresh = now - lastLevels < 400 && s && s.playing;
    const stereo = o.stereo && target.length >= 2 * o.bars;
    const per = stereo ? target.length / 2 : (target.length || o.bars);
    // the one-line style is small: half as many, wider bars (each the louder of two)
    const pair = layout === 'line' ? 2 : 1;
    const n = Math.max(1, Math.ceil(per / pair));
    const f = (dt / 16.7) * o.speed;
    const reach = layout === 'line' ? Math.min(1.3, o.size) : 1;
    if (goals.length !== (stereo ? n * 2 : n)) goals = new Float32Array(stereo ? n * 2 : n);
    for (let c = 0; c < (stereo ? 2 : 1); c++) {
      for (let i = 0; i < n; i++) {
        const at = c * per + i * pair;
        const raw = pair === 1 ? target[at] : Math.max(target[at] || 0, target[at + 1] || 0);
        goals[c * n + i] = fresh ? Math.min(1, ((raw || 0) / 255) * reach) : 0;
      }
    }
    if (fresh && o.autoscale) shape.scale(goals, f);
    if (o.filter === 'monstercat') for (let c = 0; c < (stereo ? 2 : 1); c++) VizCore.monstercat(goals, o.strength, c * n, (c + 1) * n);
    const levels = shape.move(goals, f, o);
    // spin: the bars slide along the row, round and round
    shift = (shift + o.spin * dt * 0.004 * (fresh ? 1 : 0.3)) % n;
    const level = (c, x) => { // a channel's level at a fractional position, wrapping round the row
      const p = ((x - shift) % n + n) % n, a = Math.floor(p), b = (a + 1) % n, k = p - a;
      return Math.min(1, levels[c * n + a] * (1 - k) + levels[c * n + b] * k);
    };

    sg.clearRect(0, 0, w, h);
    if (!colors || colors.key !== themeKey) {
      const cs = getComputedStyle(document.documentElement);
      colors = { key: themeKey, accent: cs.getPropertyValue('--accent').trim(), accent2: cs.getPropertyValue('--accent2').trim() };
    }
    const { accent, accent2 } = colors;
    let paint;
    if (o.color === 'custom') paint = o.custom;
    else if (o.color === 'rainbow') {
      paint = sg.createLinearGradient(0, 0, w, 0);
      for (let k = 0; k <= 6; k++) paint.addColorStop(k / 6, `hsl(${k * 60 + now * 0.02 * o.speed} 90% 72%)`);
    } else {
      paint = sg.createLinearGradient(0, 0, w, 0);
      paint.addColorStop(0, accent);
      paint.addColorStop(1, accent2);
    }
    sg.fillStyle = sg.strokeStyle = paint;
    sg.shadowColor = o.color === 'custom' ? o.custom : accent;
    sg.shadowBlur = o.glow && fresh ? 6 * dpr : 0;
    sg.lineJoin = sg.lineCap = 'round';
    const pad = sg.shadowBlur ? 3 * dpr : 0;
    // bar width and spacing: exact pixels for the visualizer source, the same proportions elsewhere
    // (the card and the line use the "bar spacing" slider: a share of each bar's room, 0 = touching)
    const unit = w / n, gap = solo ? o.barSpacing * dpr : unit * o.gap;
    const bw = solo ? o.barWidth * dpr : Math.max(0.5, unit - gap);
    const xAt = i => (solo ? i * (bw + gap) : i * unit + gap / 2);
    // bars' edges on whole screen pixels, so touching bars really touch (a bar edge between two
    // pixels gets blurred, and shows as a faint line between neighbours)
    const left = i => Math.round(xAt(i)), right = i => Math.round(solo ? xAt(i) + bw : (i + 1) * unit - gap / 2);
    // round corners shrink as the bars get closer, so touching bars make one solid shape
    const rounding = o.round ? Math.min(1, (solo ? o.barSpacing / Math.max(1, o.barWidth) : o.gap) / 0.2) : 0;

    // mono: bars stand on the bottom. stereo: left channel grows up from the middle, right channel down
    const rows = stereo ? [[0, h / 2, -1, h / 2 - pad], [1, h / 2, 1, h / 2 - pad]] : [[0, h - pad, -1, h - pad * 2]];
    for (const [c, base, dir, H] of rows) {
      if (o.style === 'wave') {
        // one smooth line across, softly filled toward the base
        const pts = [];
        for (let i = 0; i < n; i++) pts.push([xAt(i) + bw / 2, base + dir * Math.max(0.04, level(c, i) ** 1.3) * H]);
        sg.beginPath();
        sg.moveTo(0, pts[0][1]);
        for (let i = 0; i < n - 1; i++) sg.quadraticCurveTo(pts[i][0], pts[i][1], (pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2);
        sg.lineTo(w, pts[n - 1][1]);
        sg.lineWidth = Math.max(2, 2 * dpr);
        sg.globalAlpha = 0.95;
        sg.stroke();
        sg.lineTo(w, base); sg.lineTo(0, base); sg.closePath();
        sg.globalAlpha = 0.18;
        const blur = sg.shadowBlur; sg.shadowBlur = 0; sg.fill(); sg.shadowBlur = blur;
        continue;
      }
      // touching bars (and Monstercat's blocks) are drawn as one shape: one glow around the
      // outside, instead of each bar's glow showing as a line across its neighbour
      const touching = solo ? o.barSpacing === 0 : o.gap < 0.02;
      const oneShape = (o.style === 'bars' || o.style === 'monstercat') && (o.style === 'monstercat' || touching);
      if (oneShape) { sg.globalAlpha = 0.95; sg.beginPath(); }
      for (let i = 0; i < n; i++) {
        const v = level(c, i), x = xAt(i);
        if (!oneShape) { sg.globalAlpha = 0.45 + v * 0.55; sg.beginPath(); }
        if (o.style === 'dots') {
          // a dot that rides up and down with the music
          const r = Math.max(1, Math.min(bw / 2, H / 4));
          sg.arc(x + bw / 2, base + dir * (r + v ** 1.3 * (H - r * 2)), r, 0, Math.PI * 2);
        } else if (o.style === 'rays' && !stereo) {
          // spikes that grow up and down from the middle
          const bh = Math.max(bw * 0.4, v ** 1.3 * H), mid = pad + H / 2;
          sg.moveTo(x + bw / 2, mid - bh / 2); sg.lineTo(x + bw, mid); sg.lineTo(x + bw / 2, mid + bh / 2); sg.lineTo(x, mid);
          sg.closePath();
        } else if (o.style === 'rays') {
          const bh = Math.max(bw * 0.4, v ** 1.3 * H);
          sg.moveTo(x, base); sg.lineTo(x + bw / 2, base + dir * bh); sg.lineTo(x + bw, base); sg.closePath();
        } else {
          // bars, and Monstercat's square-topped blocks
          const bh = Math.max(o.style === 'monstercat' ? 2 * dpr : Math.min(bw * 0.8, H), v ** (o.style === 'monstercat' ? 1.15 : 1.3) * H);
          const x0 = left(i), bwi = Math.max(1, right(i) - x0);
          const y = dir < 0 ? base - bh : base, r = Math.max(0, Math.min(bwi / 2, bh / 2)) * rounding;
          if (r >= 0.5 && sg.roundRect) sg.roundRect(x0, y, bwi, bh, r); else sg.rect(x0, y, bwi, bh);
        }
        if (!oneShape) sg.fill();
      }
      if (oneShape) sg.fill();
    }
    sg.globalAlpha = 1;
  }
  requestAnimationFrame(drawSpectrum);

  // The cover for the current song. If it isn't there yet, try again a few times;
  // moonlit also says when it arrives (the "cover" event).
  let coverTries = 0, coverTimer = 0;
  function loadCover(fresh) {
    const img = $('.cover');
    if (!img || !s || !s.id) return;
    clearTimeout(coverTimer);
    if (fresh) { coverTries = 0; img.src = NO_COVER; }
    const id = s.id;
    img.onerror = () => {
      img.src = NO_COVER; // just the pink gradient, never a broken-picture icon
      if (s.id === id && ++coverTries <= 3) coverTimer = setTimeout(() => loadCover(false), 700 * coverTries);
    };
    img.src = `/cover?id=${encodeURIComponent(id)}&t=${Date.now()}`;
  }

  // the next song: who/what/how long, shown in the last few seconds of this one
  let upFor = '';
  function upNext(pos, dur) {
    if (!up) return;
    const n = s && s.next;
    const left = dur - pos;
    const show = !!(n && s.playing && dur && pos > 3 && left <= (n.seconds || 10) && left > 0.25);
    if (show) {
      const key = `${s.id}>${n.title}|${n.artist}`;
      if (upFor !== key) {
        upFor = key;
        up.querySelector('.un-song').textContent = layout === 'line' ? (n.line || [n.artist, n.title].filter(Boolean).join(' - ')) : [n.artist, n.title].filter(Boolean).join(' - ');
        up.querySelector('.un-time').textContent = n.duration ? fmt(n.duration) : '';
        const img = up.querySelector('img');
        if (img) { img.onerror = () => { img.src = NO_COVER; }; img.src = n.id ? `/cover?id=${encodeURIComponent(n.id)}&t=${Date.now()}` : NO_COVER; }
      }
      const by = n.by ? ` · requested by ${n.by}` : '';
      up.querySelector('em').textContent = ` in ${Math.ceil(left)}s${by}`;
    }
    up.classList.toggle('show', show);
  }

  function tick() {
    if (!s || !s.id) { up?.classList.remove('show'); return; }
    const pos = Math.min(s.duration || Infinity, s.position + (s.playing ? (performance.now() - got) / 1000 : 0));
    const dur = s.duration || 0;
    upNext(pos, dur);
    if (layout === 'card') {
      // no length known (can happen with the Spotify app): just the time played
      const cur = $('.cur'); if (cur) { cur.textContent = fmt(pos); $('.dur').textContent = dur ? fmt(dur) : ''; $('.bar').style.visibility = dur ? '' : 'hidden'; $('.bar b').style.width = dur ? `${Math.min(100, pos / dur * 100)}%` : '0%'; }
    } else {
      const t = $('.time'); if (t) t.textContent = dur ? `${fmt(pos)} / ${fmt(dur)}` : fmt(pos);
    }
  }
  setInterval(tick, 200);

  function connect() {
    const es = new EventSource('/events');
    es.onmessage = e => apply(JSON.parse(e.data));
    es.addEventListener('cover', e => { if (s && s.id === JSON.parse(e.data)) loadCover(true); });
    es.addEventListener('spectrum', e => { target = e.data.split(',').map(Number); lastLevels = performance.now(); });
    es.onerror = () => { es.close(); setTimeout(connect, 2000); };
  }
  connect();
</script>
</body>
