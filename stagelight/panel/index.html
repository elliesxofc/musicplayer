<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stagelight</title>
  <meta name="theme-color" content="#0d0b1a">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <svg class="sprites" aria-hidden="true">
    <symbol id="i-live" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="2.2" fill="currentColor"/><path d="M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7M5.6 5.6a9 9 0 0 0 0 12.8M18.4 5.6a9 9 0 0 1 0 12.8"/></g></symbol>
    <symbol id="i-rec" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="7" y="6" width="3.6" height="12" rx="1.2" fill="currentColor"/><rect x="13.4" y="6" width="3.6" height="12" rx="1.2" fill="currentColor"/></symbol>
    <symbol id="i-vol" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></g></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path d="m16 9.5 5 5M21 9.5l-5 5"/></g></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></g></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l16 16M9.9 5.8A9 9 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a16 16 0 0 1-3 3.7M6.3 7.5A16 16 0 0 0 2.5 12S6 18.5 12 18.5a9 9 0 0 0 4.2-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></g></symbol>
    <symbol id="i-out" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5h4a1.5 1.5 0 0 1 1.5 1.5v11A1.5 1.5 0 0 1 18 19h-4"/><path d="M10 8l-4 4 4 4M6 12h9"/></g></symbol>
  </svg>

  <!-- log in -->
  <main class="login" id="loginView" hidden>
    <form class="login-card" id="loginForm" autocomplete="on">
      <img class="logo-big" src="icon.svg" alt="">
      <h1>Stagelight</h1>
      <p class="muted">your stream's remote control</p>
      <input type="text" name="username" value="stagelight" autocomplete="username" hidden>
      <label class="field"><span>panel password</span>
        <input type="password" id="password" autocomplete="current-password" required maxlength="200" autofocus>
      </label>
      <button class="btn primary wide" id="loginBtn" type="submit">open the panel</button>
      <p class="error" id="loginError" role="alert"></p>
    </form>
  </main>

  <!-- the panel -->
  <main class="panel" id="panelView" hidden>
    <header class="top">
      <div class="brand"><img src="icon.svg" alt=""><b>Stagelight</b></div>
      <div class="conn"><i class="dot" id="connDot" data-kind="off"></i><span id="connText">…</span></div>
      <button class="icon-btn" id="logoutBtn" aria-label="log out" title="log out"><svg><use href="#i-out"/></svg></button>
    </header>

    <section class="card onair" id="onAir">
      <div class="onair-head">
        <span class="badge" id="liveBadge">offline</span>
        <span class="clock" id="liveClock"></span>
      </div>
      <p class="stats" id="stats"></p>
      <div class="row">
        <button class="btn big" id="streamBtn"><svg><use href="#i-live"/></svg><span id="streamText">go live</span></button>
      </div>
      <div class="row">
        <button class="btn" id="recBtn"><svg><use href="#i-rec"/></svg><span id="recText">record</span></button>
        <button class="btn" id="recPauseBtn" hidden><svg><use href="#i-pause"/></svg><span id="recPauseText">pause</span></button>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>preview</h2>
        <label class="mini-check"><input type="checkbox" id="previewOn" checked> live</label>
        <label class="mini-check"><input type="checkbox" id="editOn"> edit layout</label>
      </div>
      <div class="stage" id="stage">
        <img id="previewImg" alt="what OBS shows right now">
        <div class="boxes" id="boxes"></div>
        <p class="stage-msg" id="stageMsg">loading the preview…</p>
      </div>
      <p class="hint" id="editHint" hidden>tap a source to pick it, drag to move it, drag its corner to resize. changes show on stream straight away.</p>
      <div class="sel" id="selBar" hidden>
        <b id="selName"></b>
        <button class="btn small" id="selText">edit text</button>
        <button class="btn small" id="selHide">hide</button>
        <button class="btn small danger" id="selRemove">remove</button>
      </div>
      <div class="row add-row">
        <button class="btn small" id="addText">+ text</button>
        <button class="btn small" id="addBrowser">+ website</button>
        <button class="btn small" id="addColor">+ colour box</button>
      </div>
    </section>

    <section class="card">
      <h2>scenes</h2>
      <div class="scenes" id="scenes"></div>
    </section>

    <section class="card">
      <h2>sources in <span id="sceneName"></span></h2>
      <ul class="list" id="sources"></ul>
    </section>

    <section class="card">
      <h2>audio</h2>
      <ul class="list" id="audio"></ul>
    </section>

    <p class="foot muted">Stagelight · changes go straight to OBS on the stream PC</p>
  </main>

  <!-- asking before going live / ending the stream -->
  <div class="modal" id="confirm" hidden>
    <div class="modal-card" role="alertdialog" aria-labelledby="confirmTitle">
      <h3 id="confirmTitle"></h3>
      <p class="muted" id="confirmText"></p>
      <div class="row">
        <button class="btn" id="confirmNo">cancel</button>
        <button class="btn primary" id="confirmYes">yes</button>
      </div>
    </div>
  </div>
  <!-- adding a source / changing a text -->
  <div class="modal" id="formModal" hidden>
    <form class="modal-card" id="form" autocomplete="off">
      <h3 id="formTitle"></h3>
      <p class="muted" id="formText"></p>
      <div id="formFields"></div>
      <div class="row">
        <button class="btn" type="button" id="formNo">cancel</button>
        <button class="btn primary" type="submit" id="formYes">add</button>
      </div>
    </form>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="panel.js"></script>
</body>
</html>
